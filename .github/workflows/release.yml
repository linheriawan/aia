name: Release

# ARCHITECTURE.md §14/§15 Phase 7: tagged builds produce installers for both
# OSes and upload them to a GitHub Release. Signing/notarization are
# optional in v1 — see packaging/windows/installer.iss and
# packaging/macos/entitlements.plist for where those hooks go.

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run pyinstaller packaging/deskai.spec --noconfirm
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run pyinstaller packaging/deskai.spec --noconfirm
      - name: Build dmg
        run: bash packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/installer/*.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/windows-installer/*.exe \
            artifacts/macos-dmg/*.dmg \
            --title "${{ github.ref_name }}" \
            --generate-notes
